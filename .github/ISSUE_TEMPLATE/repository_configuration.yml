name: Configuración Manual del Repositorio
description: Lista de verificación para configurar manualmente las opciones del repositorio en GitHub
title: "[Config]: Configuración Manual del Repositorio"
labels: ["configuration", "setup"]
body:
  - type: markdown
    attributes:
      value: |
        # Configuración Manual del Repositorio
        
        Esta issue sirve como checklist para configurar manualmente las opciones del repositorio en GitHub.
        Marca cada item cuando lo hayas completado.
        
  - type: checkboxes
    id: branch-protection
    attributes:
      label: 🔒 Protección de Rama Principal (main)
      description: Configurar en Settings → Branches → Add branch protection rule → Branch name pattern: `main`
      options:
        - label: "**Require a pull request before merging** - Require approvals: **1** (del propietario)"
          required: false
        - label: "**Dismiss stale pull request approvals** when new commits are pushed"
          required: false
        - label: "**Require status checks to pass before merging** - Require branches to be up to date"
          required: false
        - label: "Seleccionar checks: Build and Test, Format Check (cuando estén disponibles)"
          required: false
        - label: "**Require conversation resolution before merging**"
          required: false
        - label: "**Do not allow bypassing the above settings**"
          required: false
        - label: "**Block force pushes**"
          required: false
        - label: "**Allow deletions** - DESHABILITADO (protege contra eliminación accidental)"
          required: false
        - label: "❌ NO marcar 'Require signed commits' (específicamente excluido)"
          required: false
          
  - type: checkboxes
    id: security
    attributes:
      label: 🛡️ Seguridad
      description: Configurar en Settings → Security → Code security and analysis
      options:
        - label: "Habilitar **Dependabot alerts**"
          required: false
        - label: "Habilitar **Dependabot security updates** (opcional pero recomendado)"
          required: false
          
  - type: checkboxes
    id: features
    attributes:
      label: ⚙️ Features del Repositorio
      description: Configurar en Settings → General → Features
      options:
        - label: "Habilitar **Issues**"
          required: false
        - label: "Habilitar **Discussions**"
          required: false
          
  - type: checkboxes
    id: pull-requests
    attributes:
      label: 📝 Pull Requests
      description: Configurar en Settings → General → Pull Requests
      options:
        - label: "**Allow merge commits** - HABILITADO (política de resolución de conflictos)"
          required: false
        - label: "**Allow auto-merge** - DESHABILITADO (específicamente deshabilitado)"
          required: false
        - label: "**Automatically delete head branches** - HABILITADO (recomendado)"
          required: false
          
  - type: checkboxes
    id: discussions-config
    attributes:
      label: 💬 Configuración de Discussions
      description: Configurar en Settings → Discussions (después de habilitar)
      options:
        - label: "Crear categoría 'General' (💬)"
          required: false
        - label: "Crear categoría 'Q&A' (🙏) - Formato Q&A"
          required: false
        - label: "Crear categoría 'Ideas / Feature Requests' (💡)"
          required: false
        - label: "Crear categoría 'Announcements' (📣)"
          required: false
          
  - type: checkboxes
    id: verification
    attributes:
      label: ✅ Verificación Final
      description: Verificar que todo está configurado correctamente
      options:
        - label: "La rama `main` aparece en Settings → Branches con protección activa"
          required: false
        - label: "No se pueden hacer push directos a `main` (requiere PR)"
          required: false
        - label: "Los PR requieren aprobación antes de merge"
          required: false
        - label: "Dependabot alerts está habilitado"
          required: false
        - label: "Issues está habilitado"
          required: false
        - label: "Discussions está habilitado"
          required: false
        - label: "Auto-merge está deshabilitado"
          required: false
        - label: "Los templates de issues aparecen al crear un nuevo issue"
          required: false
        - label: "El workflow de CI se ejecuta correctamente en los PRs"
          required: false
          
  - type: textarea
    id: notes
    attributes:
      label: Notas Adicionales
      description: Cualquier nota, problema encontrado o configuración adicional realizada
      placeholder: Añade tus notas aquí...
    validations:
      required: false
      
  - type: markdown
    attributes:
      value: |
        ---
        
        ## 📚 Referencias
        
        - [GitHub Branch Protection](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches)
        - [Dependabot](https://docs.github.com/en/code-security/dependabot)
        - [Security Policy](https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository)
        - Ver `CONTRIBUTING.md` para guía de contribución
